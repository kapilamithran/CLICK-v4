name: Deploy Supabase Edge Functions

# Runs only when an Edge Function's code, or the config.toml settings that
# affect how it's deployed (e.g. verify_jwt), actually change.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy click-backend
        run: supabase functions deploy click-backend --project-ref "$SUPABASE_PROJECT_ID"
