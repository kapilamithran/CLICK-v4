name: Deploy Supabase Edge Functions

# Runs only when an Edge Function's code, or the config.toml settings that
# affect how it's deployed (e.g. verify_jwt), actually change.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

# The deploy job only runs when the Supabase secrets are configured. Without them
# it is skipped (not failed). The target is still the SUPABASE_PROJECT_ID secret;
# this gate does not choose or change the project.
jobs:
  credentials:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Edge Function deploy skipped: SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID are not set in this repository."
          fi

  deploy:
    needs: credentials
    if: needs.credentials.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy click-backend
        run: supabase functions deploy click-backend --project-ref "$SUPABASE_PROJECT_ID"
